<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Subjects</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #eff6ff, #ede9fe);
      color: #0f172a;
    }
    .page-shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #fff;
      border-radius: 18px;
      padding: 16px 24px;
      margin-top: 24px;
      box-sizing: border-box;
    }
    .brand { font-weight: 700; font-size: 1.2rem; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a, .logout-btn {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
    }
    .nav-links a.active, .nav-links a:hover, .logout-btn:hover {
      background: rgba(255,255,255,0.12);
    }
    .panel {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 14px 30px rgba(15,23,42,0.08);
      padding: 32px;
      margin-top: 24px;
    }
    h2 { margin-top: 0; }
    .subject-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .subject-list a {
      display: block;
      background: #f8fafc;
      border: 1px solid #dbeafe;
      padding: 16px 18px;
      border-radius: 12px;
      text-decoration: none;
      color: #111827;
      font-weight: 600;
    }
    .subject-list a:hover { background: #eff6ff; }
  </style>
</head>
<body>
<div th:replace="~{fragments/role-nav :: studentNav('subjects')}"></div>

<div class="page-shell">
  <div class="panel">
    <h2>Available Subjects</h2>
    <ul class="subject-list" th:if="${subjects != null and !#lists.isEmpty(subjects)}">
      <li th:each="sub : ${subjects}">
        <a th:href="@{/student/exams/{id}(id=${sub.id})}" th:text="${sub.name}">Subject</a>
      </li>
    </ul>
    <p th:if="${subjects == null or #lists.isEmpty(subjects)}">No subjects are available right now.</p>
  </div>
</div>
</body>
</html>
