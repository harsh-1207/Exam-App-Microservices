<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Subjects</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:40px; }
        h2 { text-align:center; }

        table {
            width: 70%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th { background: #4CAF50; color: white; }

        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            text-decoration: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .exam-btn { background:#2196F3; }
        .add-btn {
            display:block; width:200px; margin:20px auto;
            padding:10px; background:#4CAF50; text-align:center;
        }

        .back-btn {
            display:block; width:200px; margin:20px auto;
            padding:10px; background:#555; text-align:center;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: #fff;
            margin: 10% auto;
            padding: 20px;
            width: 400px;
            border-radius: 6px;
            text-align: center;
        }
        .close {
            float: right;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Manage Subjects</h2>

<!-- Add Subject Button -->
<button class="btn add-btn" onclick="openModal()">Add Subject</button>

<!-- Modal -->
<div id="subjectModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3>Add New Subject</h3>
        <form th:action="@{/teacher/subjects}" method="post">
            <input type="text" name="name" placeholder="Enter subject name" required>
            <br><br>
            <button type="submit" class="btn exam-btn">Add</button>
        </form>
    </div>
</div>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
    </tr>

    <tr th:each="subject : ${subjects}">
        <td th:text="${subject.id}"></td>
        <td th:text="${subject.name}"></td>
        <td>
            <a th:href="@{/teacher/subjects/{id}/exams(id=${subject.id})}"
               class="btn exam-btn">
                View Exams
            </a>
        </td>
    </tr>
</table>

<a th:href="@{/teacher/home}" class="btn back-btn">Back to Home</a>

<script>
    function openModal() {
        document.getElementById("subjectModal").style.display = "block";
    }
    function closeModal() {
        document.getElementById("subjectModal").style.display = "none";
    }
</script>

</body>
</html>
