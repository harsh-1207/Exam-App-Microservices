<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Subjects</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:40px; }
        h2 { text-align:center; }

        table {
            width: 70%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th { background: #4CAF50; color: white; }

        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            text-decoration: none;
            color: white;
            font-size: 14px;
        }

        .exam-btn { background:#2196F3; }
        .add-btn {
            display:block; width:200px; margin:20px auto;
            padding:10px; background:#4CAF50; text-align:center;
        }
    </style>
</head>
<body>

<h2>Subjects</h2>

<a th:href="@{/teacher/subjects/add}" class="btn add-btn">Add Subject</a>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
    </tr>

    <tr th:each="subject : ${subjects}">
        <td th:text="${subject.id}"></td>
        <td th:text="${subject.name}"></td>
        <td>
            <!-- 🔥 GO TO EXAMS OF THIS SUBJECT -->
            <a th:href="@{/teacher/subjects/{id}/exams(id=${subject.id})}"
               class="btn exam-btn">
                View Exams
            </a>
        </td>
    </tr>

</table>

</body>
</html>
