<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
     <title>Manage Subjects</title>
     <style>
         body {
             margin: 0;
             font-family: 'Segoe UI', sans-serif;
             background: linear-gradient(135deg, #f8fafc, #eff6ff);
             color: #0f172a;
         }
         .page-shell {
             max-width: 960px;
             margin: 0 auto;
             padding: 24px;
         }
         .topbar {
             display: flex;
             justify-content: space-between;
             align-items: center;
             background: #0f172a;
             color: #fff;
             border-radius: 18px;
             padding: 16px 24px;
             margin-top: 24px;
             box-sizing: border-box;
         }
         .brand { font-weight: 700; font-size: 1.2rem; }
         .nav-links { display: flex; gap: 16px; }
         .nav-links a, .logout-btn {
             color: #e2e8f0;
             text-decoration: none;
             font-weight: 600;
             padding: 10px 12px;
             border-radius: 10px;
         }
         .nav-links a.active, .nav-links a:hover, .logout-btn:hover {
             background: rgba(255,255,255,0.12);
         }
         .panel {
             background: #fff;
             border-radius: 20px;
             box-shadow: 0 14px 30px rgba(15,23,42,0.08);
             padding: 32px;
             margin-top: 24px;
         }
         h2 { margin-top: 0; }
         .toolbar {
             display: flex;
             justify-content: flex-end;
             margin-bottom: 20px;
         }
         .btn {
             display: inline-block;
             border: none;
             border-radius: 10px;
             padding: 10px 14px;
             font-weight: 700;
             text-decoration: none;
             cursor: pointer;
         }
         .primary { background: #16a34a; color: white; }
         .secondary { background: #e5e7eb; color: #111827; }
         table {
             width: 100%;
             border-collapse: collapse;
         }
         th, td {
             padding: 14px 12px;
             border-bottom: 1px solid #e5e7eb;
             text-align: left;
         }
         th { background: #f1f5f9; }
         .action-btn {
             display: inline-block;
             background: #2563eb;
             color: white;
             text-decoration: none;
             padding: 8px 12px;
             border-radius: 8px;
             font-weight: 600;
         }
         .modal {
             display: none;
             position: fixed;
             inset: 0;
             background: rgba(15, 23, 42, 0.4);
             justify-content: center;
             align-items: center;
         }
         .modal-content {
             background: #fff;
             width: min(420px, 92vw);
             border-radius: 16px;
             padding: 24px;
             box-shadow: 0 16px 40px rgba(15,23,42,0.25);
         }
         .modal-content h3 { margin-top: 0; }
         .modal-content form {
             display: flex;
             flex-direction: column;
             gap: 12px;
         }
         input {
             padding: 11px 12px;
             border: 1px solid #d1d5db;
             border-radius: 10px;
             font-size: 1rem;
         }
     </style>
</head>
<body>
<div th:replace="~{fragments/role-nav :: teacherNav('subjects')}"></div>

<div class="page-shell">
     <div class="panel">
         <h2>Manage Subjects</h2>

         <div class="toolbar">
             <button class="btn primary" onclick="openModal()">Add Subject</button>
         </div>

         <table th:if="${subjects != null and !#lists.isEmpty(subjects)}">
             <thead>
             <tr>
                 <th>ID</th>
                 <th>Name</th>
                 <th>Action</th>
             </tr>
             </thead>
             <tbody>
             <tr th:each="subject : ${subjects}">
                 <td th:text="${subject.id}">1</td>
                 <td th:text="${subject.name}">Math</td>
                 <td>
                     <a class="action-btn" th:href="@{/teacher/subjects/{id}/exams(id=${subject.id})}">View Exams</a>
                 </td>
             </tr>
             </tbody>
         </table>

         <p th:if="${subjects == null or #lists.isEmpty(subjects)}">No subjects available yet.</p>
         <p style="margin-top: 18px;"><a th:href="@{/teacher/home}" style="color: #1d4ed8; font-weight: 600;">Back to home</a></p>
     </div>
</div>

<div id="subjectModal" class="modal">
     <div class="modal-content">
         <span onclick="closeModal()" style="float: right; font-size: 24px; cursor: pointer;">&times;</span>
         <h3>Add New Subject</h3>
         <form th:action="@{/teacher/subjects}" method="post">
             <input type="text" name="name" placeholder="Enter subject name" required>
             <button type="submit" class="btn primary">Add Subject</button>
         </form>
     </div>
</div>

<script>
     function openModal() {
         document.getElementById("subjectModal").style.display = "flex";
     }
     function closeModal() {
         document.getElementById("subjectModal").style.display = "none";
     }
</script>
</body>
</html>
