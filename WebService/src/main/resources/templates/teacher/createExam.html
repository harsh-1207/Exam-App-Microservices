<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Exam</title>

  <style>
    body { font-family: Arial; background:#f4f6f9; padding:40px; }
    h2 { text-align:center; }

    .container {
        width: 70%;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, button {
        padding: 8px;
        margin: 6px 0;
    }

    .question-box {
        border: 1px solid #ccc;
        padding: 15px;
        margin-top: 15px;
        border-radius: 4px;
    }

    .option-row {
        margin-left: 20px;
    }

    .btn {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
    }

    .add { background: #4CAF50; }
    .remove { background: #f44336; }
    .save { background: #2196F3; }
  </style>
</head>
<body>

<div class="container">
  <h2>Create Exam</h2>

  <!-- FORM -->
  <form th:action="@{/teacher/createExam}" method="post" onsubmit="preparePayload()">

    <!-- Hidden subjectId -->
    <input type="hidden" name="subjectId" th:value="${subjectId}">
    <input type="hidden" name="questionsJson" id="questionsJson">

    <label>Exam Title</label><br>
    <input type="text" name="title" required><br><br>

    <h3>Questions</h3>

    <div id="questionsContainer"></div>

    <button type="button" class="btn add" onclick="addQuestion()">+ Add Question</button>

    <br><br>
    <button type="submit" class="btn save">Create Exam</button>
  </form>
</div>

<script>
  let questions = [];

  function addQuestion() {
      const qIndex = questions.length;

      questions.push({
          text: "",
          options: []
      });

      const qDiv = document.createElement("div");
      qDiv.className = "question-box";
      qDiv.id = "question-" + qIndex;

      qDiv.innerHTML = `
          <label>Question</label><br>
          <input type="text" oninput="updateQuestionText(${qIndex}, this.value)" required><br>

          <div id="options-${qIndex}"></div>

          <button type="button" class="btn add" onclick="addOption(${qIndex})">+ Add Option</button>
      `;

      document.getElementById("questionsContainer").appendChild(qDiv);
  }

  function updateQuestionText(qIndex, value) {
      questions[qIndex].text = value;
  }

  function addOption(qIndex) {
      const optionIndex = questions[qIndex].options.length;

      questions[qIndex].options.push({
          text: "",
          correct: false
      });

      const optDiv = document.createElement("div");
      optDiv.className = "option-row";

      optDiv.innerHTML = `
          <input type="radio" name="correct-${qIndex}" onclick="markCorrect(${qIndex}, ${optionIndex})">
          <input type="text" placeholder="Option text"
                 oninput="updateOptionText(${qIndex}, ${optionIndex}, this.value)" required>
      `;

      document.getElementById(`options-${qIndex}`).appendChild(optDiv);
  }

  function updateOptionText(qIndex, optIndex, value) {
      questions[qIndex].options[optIndex].text = value;
  }

  function markCorrect(qIndex, optIndex) {
      questions[qIndex].options.forEach((opt, i) => {
          opt.correct = (i === optIndex);
      });
  }

  function preparePayload() {
      document.getElementById("questionsJson").value = JSON.stringify(questions);
  }
</script>

</body>
</html>
