<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Exam</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #eef2ff);
      color: #0f172a;
    }
    .page-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .panel {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 14px 30px rgba(15,23,42,0.08);
      padding: 32px;
    }
    h2 { margin-top: 0; }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn {
      display: inline-block;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
  </style>
</head>
<body>
<div class="page-shell">
  <div class="panel">
    <h2>Create Exam</h2>

    <form th:action="@{/teacher/createExam}" method="post">
      <input type="hidden" name="subjectId" th:value="${subjectId}">

      <div>
        <label for="title">Exam Title</label>
        <input type="text" id="title" name="title" placeholder="Enter exam title" required>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Create Exam</button>
        <a th:href="@{/teacher/subjects}" class="btn secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
