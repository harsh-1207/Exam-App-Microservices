<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Subject Exams</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e0f2fe);
      color: #0f172a;
    }
    .page-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #fff;
      border-radius: 18px;
      padding: 16px 24px;
      margin-top: 24px;
      box-sizing: border-box;
    }
    .brand { font-weight: 700; font-size: 1.2rem; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a, .logout-btn {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
    }
    .nav-links a.active, .nav-links a:hover, .logout-btn:hover { background: rgba(255,255,255,0.12); }
    .panel {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 14px 30px rgba(15,23,42,0.08);
      padding: 32px;
      margin-top: 24px;
    }
    h2 { margin-top: 0; }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }
    .btn {
      display: inline-block;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #16a34a; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    th { background: #f1f5f9; }
    .action-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/role-nav :: teacherNav('subjects')}"></div>

<div class="page-shell">
  <div class="panel">
    <h2 th:text="'Exams for ' + ${subject.name}">Exams</h2>

    <div class="toolbar">
      <a class="btn primary" th:href="@{/teacher/createExam(subjectId=${subject.id})}">Add Exam</a>
    </div>

    <div th:if="${exams == null or #lists.isEmpty(exams)}">
      <p>No exams available for this subject yet.</p>
    </div>

    <table th:if="${exams != null and !#lists.isEmpty(exams)}">
      <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="exam : ${exams}">
        <td th:text="${exam.id}">1</td>
        <td th:text="${exam.title}">Exam</td>
        <td th:text="${exam.published ? 'Published' : 'Draft'}">Draft</td>
        <td>
          <a class="action-btn" th:href="@{/teacher/editExam/{id}(id=${exam.id})}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>

    <p style="margin-top: 18px;"><a th:href="@{/teacher/subjects}" style="color: #1d4ed8; font-weight: 600;">Back to subjects</a></p>
  </div>
</div>
</body>
</html>
