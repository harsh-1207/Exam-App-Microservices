<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Exams</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:40px; }
    h2 { text-align:center; }

    table {
        width: 70%;
        margin: 30px auto;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }

    th { background: #2196F3; color: white; }

    .btn {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        text-decoration: none;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .add-btn {
        display:block; width:200px; margin:20px auto;
        padding:10px; background:#4CAF50; text-align:center;
    }

    .back-btn {
        display:block; width:200px; margin:20px auto;
        padding:10px; background:#555; text-align:center;
    }
  </style>
</head>
<body>

<h2 th:text="'Exams for ' + ${subject.name}"></h2>

<!-- Add Exam Button (always visible) -->
<a th:href="@{/teacher/createExam(subjectId=${subject.id})}" class="btn add-btn">Add Exam</a>

<!-- Show exams only if they exist -->
<div th:if="${#lists.isEmpty(exams)}">
  <p style="text-align:center;">No exams available for this subject.</p>
</div>

<div th:if="${!#lists.isEmpty(exams)}">
  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Action</th>
    </tr>
    <tr th:each="exam : ${exams}">
      <td th:text="${exam.id}"></td>
      <td th:text="${exam.title}"></td>
      <td>
        <a th:href="@{/teacher/editExam/{id}(id=${exam.id})}" class="btn exam-btn">Edit</a>
      </td>
    </tr>
  </table>
</div>

<a th:href="@{/teacher/subjects}" class="btn back-btn">Back to Subjects</a>

</body>
</html>
