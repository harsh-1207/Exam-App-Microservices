<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Exam</title>
    <style>
        body{font-family:Segoe UI,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:30px auto;padding:0 20px}.card,.q{background:#fff;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 4px 18px #0000000d}.field{margin:12px 0}input[type=text]{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.opt{display:grid;grid-template-columns:35px 1fr;gap:8px;margin:8px 0}.actions{display:flex;gap:10px}.btn{border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}.save{background:#0f766e;color:white}.add{background:#2563eb;color:white}.remove{background:#fee2e2;color:#991b1b}.back{background:#dc2626;color:#fff;text-decoration:none}.status{display:flex;gap:18px;align-items:center}
    </style>
</head>
<body>
<div th:replace="~{fragments/role-nav :: teacherNav('subjects')}"></div>
<div class="wrap">
    <form th:action="@{/teacher/editExam/{id}(id=${exam.id})}" method="post" id="editForm">
        <div class="card"><h1>Edit Exam</h1><input type="hidden" name="subjectId" th:value="${exam.subjectId}">
            <div class="field"><label>Exam name</label><input type="text" name="title" th:value="${exam.title}"
                                                              required></div>
            <div class="field status"><b>Status</b><label><input type="radio" name="published" value="false"
                                                                 th:checked="${!exam.published}">
                Draft</label><label><input type="radio" name="published" value="true" th:checked="${exam.published}">
                Published</label></div>
        </div>
        <div id="questions">
            <div class="q" th:each="q,qs:${exam.questions}"><input type="hidden" name="questionId" th:value="${q.id}">
                <h3>Question <span th:text="${qs.count}"></span></h3><input type="text" name="questionText"
                                                                            th:value="${q.questionText}" required>
                <div class="opt" th:each="o,os:${q.options}"><input type="hidden" name="optionIdFlat"
                                                                    th:value="${o.id}"><input type="radio"
                                                                                              th:name="'correct_'+${qs.index}"
                                                                                              th:value="${os.index}"
                                                                                              th:checked="${o.correct}"
                                                                                              onchange="syncCorrect()"><input
                        type="text" name="optionTextFlat" th:value="${o.text}" required></div>
                <input type="hidden" name="correctIndex" th:id="'correctIndex_'+${qs.index}" value="0">
                <button type="button" class="btn remove" onclick="this.closest('.q').remove(); renumber();">Remove
                    Question
                </button>
            </div>
        </div>
        <div class="card">
            <div class="actions">
                <button type="button" class="btn add" onclick="addQuestion()">+ Add Question</button>
                <button type="submit" class="btn save">Submit Changes</button>
                <a class="btn back" th:href="@{/teacher/subjects/{subjectId}/exams(subjectId=${exam.subjectId})}">Go
                    Back Without Saving</a></div>
        </div>
    </form>
</div>
<script th:inline="javascript">
    let next=[[${exam.questions != null ? #lists.size(exam.questions) : 0}]];function addQuestion(){const i=next++;const d=document.createElement('div');d.className='q';d.innerHTML=`<input type="hidden" name="questionId" value="0"><h3>New Question</h3><input type="text" name="questionText" placeholder="Question" required>${[0,1,2,3].map(j=>`<div class="opt"><input type="hidden" name="optionIdFlat" value="0"><input type="radio" name="correct_${i}" value="${j}" ${j===0?'checked':''} onchange="syncCorrect()"><input type="text" name="optionTextFlat" placeholder="Option ${j+1}" required></div>`).join('')}<input type="hidden" name="correctIndex" id="correctIndex_${i}" value="0"><button type="button" class="btn remove" onclick="this.closest('.q').remove(); renumber();">Remove Question</button>`;document.getElementById('questions').appendChild(d);renumber()}function renumber(){document.querySelectorAll('#questions .q').forEach((q,i)=>{q.querySelector('h3').textContent='Question '+(i+1);q.querySelectorAll('input[type=radio]').forEach((r,j)=>{r.name='correct_'+i;r.value=j});let h=q.querySelector('input[name=correctIndex]');h.id='correctIndex_'+i});syncCorrect()}function syncCorrect(){document.querySelectorAll('#questions .q').forEach((q,i)=>{const c=q.querySelector('input[type=radio]:checked');q.querySelector('input[name=correctIndex]').value=c?c.value:0})}document.getElementById('editForm').addEventListener('submit',syncCorrect);renumber();
</script>
</body>
</html>
