<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin-top: 100px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .subjects-btn {
            background-color: #4CAF50;
        }

        .logout-btn {
            background-color: #f44336;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Teacher Dashboard</h2>

    <!-- 🔹 Go to Subjects List -->
    <a th:href="@{/teacher/subjects}" class="btn subjects-btn">
        Manage Subjects
    </a>

    <!-- 🔹 Logout -->
    <a th:href="@{/logout}" class="btn logout-btn">
        Logout
    </a>
</div>

</body>
</html>
