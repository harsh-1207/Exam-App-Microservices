spring:
  application:
    name: USER-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Mockingbird@1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8082

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

internal:
  secret: ${INTERNAL_SECRET:gateway-secret-123456789101112131415}