spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
            - id: exam-service
              uri: lb://EXAM-SERVICE
              predicates:
                - Path=/subjects/**, /exams/**, /questions/**

            - id: result-service
              uri: lb://RESULT-SERVICE
              predicates:
                - Path=/result/**
          default-filters:
            - RemoveRequestHeader=Cookie

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:supersecretkeysupersecretkeysadasdkasdkashdkashdaskdhaskdhaskjd}

internal:
  secret: ${INTERNAL_SECRET:gateway-secret-123456789101112131415}